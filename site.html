<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J&S Coding | Two Developers.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--muted:#8a8a8a;--accent:#e2672f;--glass:rgba(255,255,255,.09);
--sans:'Space Grotesk',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);overflow-x:hidden}
a{color:inherit;text-decoration:none}
.btn{display:inline-block;background:var(--accent);color:#fff;font:700 .85rem var(--mono);padding:.8rem 1.4rem;border:0;cursor:pointer;transition:transform .25s,filter .25s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}

/* pasek produktów na górze */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:1rem;padding:.6rem 2rem;font:.75rem var(--sans);opacity:.85}
.topbar a{display:flex;align-items:center;gap:.4rem;padding-right:1rem;border-right:1px solid #fff3;transition:opacity .2s}
.topbar a:last-child{border:0}.topbar a:hover{opacity:.6}

/* okno z informacjami o grze */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:1.5rem;background:#000b;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.modal.open{opacity:1;visibility:visible}
.panel{position:relative;width:min(640px,100%);max-height:90vh;overflow:auto;background:#0d0d0d;border:1px solid #fff2;transform:translateY(30px) scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.modal.open .panel{transform:none}
.panel .cover{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden}
.panel .cover .m{width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center;display:block}
.panel .body{padding:1.6rem 1.8rem 2rem}
.panel h3{font:700 2rem var(--sans);letter-spacing:-.03em}
.panel .by{margin:.4rem 0 1rem;color:var(--muted);font-size:.8rem}
.panel .by b{color:var(--fg)}
.panel p{font-size:.85rem;line-height:1.7;color:#ccc;margin-bottom:1.6rem}
.panel .x{position:absolute;top:.8rem;right:.8rem;z-index:3;width:36px;height:36px;border:0;background:#000a;color:#fff;font-size:1.2rem;cursor:pointer;transition:background .2s}
.panel .x:hover{background:var(--accent)}
.game{display:inline-flex;align-items:center;gap:.6rem}
.game::after{content:"↗";transition:transform .25s}.game:hover::after{transform:translate(3px,-3px)}

/* nawigacja (szkło) */
nav{position:fixed;top:2.4rem;left:2rem;right:2rem;z-index:50;display:flex;align-items:center;justify-content:space-between;
padding:.7rem 1rem .7rem 1.2rem;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .4s,transform .4s}
nav.scrolled{background:rgba(20,20,20,.75)}
.logo{font:700 1.7rem var(--sans);letter-spacing:-.04em}
.links{display:flex;gap:2rem;font-size:.85rem;position:absolute;left:50%;transform:translateX(-50%)}
.links a{opacity:.8;transition:opacity .2s,color .2s}.links a:hover{opacity:1;color:var(--accent)}

/* hero – tło zmienia się po najechaniu na link w menu */
.hero{position:relative;height:100vh;display:grid;place-items:center;text-align:center;overflow:hidden}
.hero .bg{position:absolute;left:-5%;top:-5%;width:110%;height:110%;object-fit:cover;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);
filter:blur(14px);transition:opacity .9s,filter .9s,transform 1.6s}
.hero .bg.on{opacity:1;filter:blur(0);transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0005,#000d 95%)}
.hero .in{position:relative;z-index:2;max-width:760px;padding:0 1.5rem}
h1{font:700 clamp(2.4rem,5vw,4rem) var(--sans);letter-spacing:-.04em}
.hero p{margin-top:1rem;font-size:.95rem;line-height:1.6}
.hero .in>*{opacity:0;transform:translateY(24px);animation:up .9s .2s forwards}
.hero .in p{animation-delay:.45s}
@keyframes up{to{opacity:1;transform:none}}

/* krzyżyki "+" */
.plus{position:absolute;width:20px;height:20px;z-index:3;opacity:.7}
.plus::before,.plus::after{content:"";position:absolute;background:#fff}
.plus::before{left:9px;top:0;width:2px;height:20px}.plus::after{top:9px;left:0;height:2px;width:20px}
.hero .plus:nth-of-type(1){left:23%;top:32%}.hero .plus:nth-of-type(2){right:23%;top:32%}
.hero .plus:nth-of-type(3){left:23%;top:65%}.hero .plus:nth-of-type(4){right:23%;top:65%}

section{padding:7rem 2rem;position:relative}
h2{font:700 clamp(1.8rem,3vw,2.6rem) var(--sans);letter-spacing:-.03em;text-align:center}
.sub{color:#bbb;text-align:center;max-width:520px;margin:1rem auto 3rem;font-size:.85rem;line-height:1.6}

/* statystyki */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:1200px;margin:auto}
.stat{border:1px solid #fff2;padding:3rem 1rem;text-align:center;background:#0a0a0a}
.stat b{display:block;font:400 clamp(2.4rem,5vw,4.5rem) var(--mono);letter-spacing:-.05em}
.stat span{font-size:.75rem;color:var(--muted)}

/* karty firm – rozmyte tło wyostrza się po najechaniu */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:1200px;margin:auto}
.card{position:relative;min-height:340px;display:grid;place-items:center;text-align:center;padding:2rem;overflow:hidden;background:#0a0a0a}
.card .img{position:absolute;left:-20px;top:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;background-size:cover;background-position:center;filter:blur(10px) brightness(.55);transition:filter .6s,transform .8s}
.card:hover .img{filter:blur(2px) brightness(.8);transform:scale(1.06)}
.card .c{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1rem;max-width:320px;font-size:.85rem;line-height:1.5}
.card h3{font:700 2rem var(--sans);letter-spacing:-.03em}
.card.next{background:radial-gradient(circle at 70% 20%,#2a3d6a55,#000 70%)}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}

/* stopka z odsłanianym obrazem (efekt "kurtyny") */
.curtain{position:relative;height:60vh;clip-path:inset(0)}
.curtain .fix{position:fixed;inset:0;height:100vh;z-index:-1}
.curtain .m{width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center;display:block}
footer{background:#000;padding:6rem 2rem 1.5rem;position:relative}
.fgrid{display:grid;grid-template-columns:2fr 1fr;gap:2rem;max-width:1200px;margin:auto}
.fgrid h4{font:500 1.8rem var(--sans);max-width:460px;letter-spacing:-.03em;line-height:1.1;margin-bottom:3rem}
.fgrid h5{color:var(--muted);font:500 1rem var(--sans);margin-bottom:1rem}
.fgrid li{list-style:none;font-size:.8rem;margin:.7rem 0}.fgrid li a:hover{color:var(--accent)}
.copy{display:flex;justify-content:space-between;max-width:1200px;margin:5rem auto 0;font-size:.75rem}

@media(max-width:800px){.links{display:none}.stats,.grid,.fgrid{grid-template-columns:1fr}.topbar{overflow:auto}}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>
<div class="modal" id="modal" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true">
    <button class="x" id="modalX" aria-label="Zamknij">✕</button>
    <div class="cover" id="mCover"></div>
    <div class="body">
      <h3 id="mTitle"></h3>
      <div class="by">Twórca: <b id="mBy"></b></div>
      <p id="mText"></p>
      <a class="btn game" id="mGame" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>
<nav id="nav">
  <a href="#home" class="logo" id="logo"></a>
  <div class="links" id="links"></div>
  <a href="#kontakt" class="btn" id="cta"></a>
</nav>

<header class="hero" id="home">
  <div id="heroBgs"></div>
  <i class="plus"></i><i class="plus"></i><i class="plus"></i><i class="plus"></i>
  <div class="in"><h1 id="h1"></h1><p id="lead"></p></div>
</header>

<section id="about">
  <div class="stats" id="stats"></div>
</section>

<section id="companies">
  <h2 id="cTitle"></h2><p class="sub" id="cSub"></p>
  <div class="grid" id="cards"></div>
</section>

<div class="curtain"><div class="fix" id="curtainImg"></div></div>
<footer id="kontakt">
  <div class="fgrid">
    <div><h4 id="fTitle"></h4><div class="logo" id="fLogo"></div></div>
    <div><h5>Nawigacja</h5><ul id="fNav"></ul></div>
  </div>
  <div class="copy"><span id="copy"></span><a href="#">Polityka prywatności</a><a href="#">Regulamin</a><span id="credit"></span></div>
</footer>

<script>
/* =====================================================================
   ★ TU EDYTUJESZ WSZYSTKO ★  — teksty, linki, kolory, zdjęcia, liczby.
   ZDJĘCIA I FILMY: w każdym polu "bg" / "img" / "curtainImg" wpisz adres (https://...)
   albo ścieżkę do pliku obok index.html:
     zdjęcie:  "img/tlo.jpg"   (jpg, png, webp, gif, svg)
     film:     "video/tlo.mp4" (mp4, webm, ogv, mov) — gra sam, w pętli, bez dźwięku
   Puste "" = ciemny gradient.
   ===================================================================== */
const CONFIG = {
  accent: "#e2672f",
  logo: "J&S Coding ",
  cta: { text: "Contact", href: "#kontakt" },

  // Pasek na górze. Kliknięcie w pozycję otwiera okno z informacjami o grze.
  //   label   – napis na pasku
  //   title   – nazwa gry
  //   creator – nazwa twórcy
  //   text    – opis gry
  //   media   – okładka: zdjęcie lub film (puste "" = gradient)
  //   link    – ★ TU WKLEJ LINK DO GRY (otworzy się po kliknięciu przycisku)
  //   button  – napis na przycisku, np. "Game"
  topbar: [
    { label: "Pain And Find A Rock!", title: "Paint And Find A Rock! 🪨", creator: "J&S Coding", text: "First game of J&S Coding. Nothing to say...", media: "WhatsApp Image 2026-11-06 at 12.45.41 PM.jpeg", link: "https://www.roblox.com/games/136025545650838/Paint-And-Find-A-Rock", button: "Game" },
    { label: "Something...", title: "Nothing...", creator: "J&S Coding", text: "SOMETHING", media: "", link: "https://example.com/gra-2", button: "Game" },
    { label: "Something...", title: "Something...", creator: "J&S Coding", text: "SOMETHING.", media: "", link: "https://example.com/gra-3", button: "Game" },
    { label: "Something...", title: "Something...", creator: "J&S Coding", text: "SOMETHING", media: "", link: "https://example.com/gra-4", button: "Game" }
  ],

  // Opcjonalne tło hero dla każdego linku menu (po najechaniu myszką).
  // Puste "" = zostaje domyślne tło z hero.bg
  nav: [
    { label: "Start",    href: "#home",      bg: "" },
    { label: "O nas",    href: "#about",     bg: "" },
    { label: "Firmy",    href: "#companies", bg: "" },
    { label: "Kariera",  href: "#kontakt",  bg: "" },
    { label: "Aktualności", href: "#kontakt", bg: "Discord-logo.jpg" }
  ],
  hero: {
    bg: "Nagrywanie 2026-11-16 150015.mp4",   // ← TŁO "Budujemy przyszłość zabawy": zdjęcie lub film, np. "video/hero.mp4"
    fallback: "linear-gradient(135deg,#3a3a1a,#111)",   // gdy bg jest puste
    title: "We create games, and you play them.",
    text: "And what if we want to be number one in Roblox games?"
  },

  stats: [
    { value: 0, suffix: "", decimals: 1, label: "Obserwujących" },
    { value: 0, suffix: "", decimals: 1, label: "Użytkowników miesięcznie" },
    { value: 23,  suffix: "", decimals: 0, label: "Visits" }
  ],

  companies: {
    title: "Nasze firmy", sub: "Portfolio produktów z różnych obszarów — i kolejne w drodze.",
    cards: [
      { name: "Paint And Find A Rock! 🪨", text: "First game!",       btn: "About...", href: "#", img: "WhatsApp Image 2026-11-06 at 12.45.41 PM.jpeg" },
      { name: "Produkt B", text: "Legendarny klient — część rodziny.", btn: "Zobacz",             href: "#", img: "" },
      { name: "Produkt C", text: "Centrum do odkrywania i dzielenia się paczkami.", btn: "Zobacz", href: "#", img: "" },
      { name: "Produkt D", text: "Serwis skinów i coś jeszcze w drodze.", btn: "Zobacz",          href: "#", img: "" },
      { name: "Produkt E", text: "Oficjalny partner Marketplace.",     btn: "Zobacz",             href: "#", img: "" },
      { name: "Coś nowego", text: "Wkrótce…", btn: "", href: "#", img: "", next: true }
    ]
  },

  footer: {
    title: "Tworzymy narzędzia i produkty, którym ufają miliony graczy.",
    nav: [["Start","#home"],["About","#about"],["Our Games","#companies"],["Carrier","#"],["News","#"]],
    copy: "2026© J&S Coding | Wszelkie prawa zastrzeżone",
    curtainImg: "graweb.mp4"   // zdjęcie lub film odsłaniany nad stopką
  }
};

/* ============ poniżej silnik – zwykle nie trzeba ruszać ============ */
const $ = id => document.getElementById(id);
const isVideo = u => /\.(mp4|webm|ogv|mov)(\?.*)?$/i.test(u || '');
// zwraca <video> dla filmów, a dla zdjęć/gradientu <div> z tłem
const media = (src, fb, cls, attrs = '') => isVideo(src)
  ? `<video class="${cls}" ${attrs} src="${src}" autoplay muted loop playsinline preload="auto"></video>`
  : `<div class="${cls}" ${attrs} style="background-image:${src ? `url('${src}')` : fb}"></div>`;
document.documentElement.style.setProperty('--accent', CONFIG.accent);
document.title = CONFIG.logo;

$('logo').textContent = $('fLogo').textContent = CONFIG.logo;
$('cta').textContent = CONFIG.cta.text; $('cta').href = CONFIG.cta.href;
// pasek produktów + okno z informacjami o grze
$('topbar').innerHTML = CONFIG.topbar.map((t, i) => `<a href="#" data-g="${i}">${t.label}</a>`).join('');
const modal = $('modal');
const openGame = i => {
  const g = CONFIG.topbar[i];
  $('mCover').innerHTML = media(g.media, 'linear-gradient(135deg,#2b5876,#4e4376)', 'm');
  $('mTitle').textContent = g.title; $('mBy').textContent = g.creator; $('mText').textContent = g.text;
  const b = $('mGame'); b.textContent = g.button || 'Game'; b.href = g.link || '#';
  modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden';
};
const closeGame = () => {
  modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); document.body.style.overflow = '';
  $('mCover').innerHTML = '';   // zatrzymuje film
};
$('topbar').addEventListener('click', e => { const a = e.target.closest('a'); if (a) { e.preventDefault(); openGame(+a.dataset.g); } });
$('modalX').addEventListener('click', closeGame);
modal.addEventListener('click', e => { if (e.target === modal) closeGame(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeGame(); });
$('h1').textContent = CONFIG.hero.title; $('lead').textContent = CONFIG.hero.text;

// menu + zmiana tła hero po hoverze
$('links').innerHTML = CONFIG.nav.map((n,i) => `<a href="${n.href}" data-i="${i}">${n.label}</a>`).join('');
// warstwa 0 = domyślne tło hero; kolejne = tła linków menu (tylko te, które mają bg)
$('heroBgs').innerHTML = [CONFIG.hero.bg, ...CONFIG.nav.map(n => n.bg)]
  .map((src, i) => (i === 0 || src) ? media(src, CONFIG.hero.fallback, 'bg', `data-i="${i}"`) : '').join('');
const bgs = [...document.querySelectorAll('.hero .bg')];
const showBg = i => bgs.forEach(b => b.classList.toggle('on', +b.dataset.i === i));
showBg(0);
$('links').addEventListener('mouseover', e => {
  const a = e.target.closest('a'); if (!a) return;
  const idx = +a.dataset.i + 1;
  showBg(bgs.some(b => +b.dataset.i === idx) ? idx : 0);
});
$('links').addEventListener('mouseleave', () => showBg(0));

// statystyki
$('stats').innerHTML = CONFIG.stats.map(s =>
  `<div class="stat"><b data-v="${s.value}" data-d="${s.decimals}" data-s="${s.suffix}">0${s.suffix}</b><span>${s.label}</span></div>`).join('');

// karty
$('cTitle').textContent = CONFIG.companies.title; $('cSub').textContent = CONFIG.companies.sub;
$('cards').innerHTML = CONFIG.companies.cards.map(c => `
  <div class="card reveal ${c.next ? 'next' : ''}">
    ${c.next ? '' : media(c.img, 'linear-gradient(135deg,#2b5876,#4e4376)', 'img')}
    <div class="c"><h3>${c.name}</h3><p>${c.text}</p>${c.btn ? `<a class="btn" href="${c.href}">${c.btn}</a>` : ''}</div>
    ${c.next ? '<i class="plus" style="right:1rem;top:1rem"></i><i class="plus" style="left:1rem;bottom:1rem"></i>' : ''}
  </div>`).join('');

// stopka
const F = CONFIG.footer;
$('fTitle').textContent = F.title;
$('fNav').innerHTML = F.nav.map(([t,h]) => `<li><a href="${h}">${t}</a></li>`).join('');
$('copy').textContent = F.copy; $('credit').textContent = F.credit;
$('curtainImg').innerHTML = media(F.curtainImg, 'radial-gradient(ellipse at 50% 70%,#6a7a8a 0%,#1a2230 40%,#050608 80%)', 'm');

// nawigacja po przewinięciu
addEventListener('scroll', () => $('nav').classList.toggle('scrolled', scrollY > 50), { passive: true });

// odliczanie liczb
const count = el => {
  const end = +el.dataset.v, d = +el.dataset.d, suf = el.dataset.s, t0 = performance.now(), dur = 1600;
  const tick = t => {
    const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
    el.textContent = (end * e).toFixed(d).replace('.', ',') + suf;
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
};

// pojawianie się przy przewijaniu (karty, liczby)
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target; io.unobserve(el);
  if (el.matches('.stat b')) count(el);
  else el.classList.add('in');
}), { threshold: .25 });
document.querySelectorAll('.stat b, .reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
